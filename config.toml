# シフト作成の設定
# 未確定の項目は仮の値です。お店の実情に合わせて書き換えてください（画面の左側でも変えられます）。

# 出勤可否を聞く刻み（分）。Googleフォームと同じにする
slot_minutes = 30

[shift]
# 1回の勤務の長さ（時間）。1日に入るのは1回（連続）まで
min_hours = 1
# 原則この長さまで。人数が足りない時間帯をうめるときだけ、max_hours まで延ばしてよい
normal_max_hours = 2
max_hours = 8

# 必要人数。上から順に当てはめ、同じ時間帯は後の行で上書きする
# days: 毎日 / 平日 / 土 / 日祝 / 土日祝 / 曜日（例 "月水金"）/ 日付（例 "11/23"）
[[rules]]
days = "毎日"
start = "10:00"
end = "22:00"
people = 2

[[rules]]
days = "毎日"
start = "11:30"
end = "13:30"
people = 3

[[rules]]
days = "毎日"
start = "18:00"
end = "21:00"
people = 3

[[rules]]
days = "土日祝"
start = "11:00"
end = "20:00"
people = 4

[leader]
# 営業中はいつも責任者（スタッフ表の「責任者」に○）を1人以上入れる
required = false

[solver]
# 計算時間の上限（秒）
time_limit_seconds = 20

# 優先条件の重み（大きいほど重視）
[weights]
shortage = 1000       # 必要人数に1人足りない30分ごとに減点（最優先）
leader_missing = 300  # 責任者がいない30分ごとに減点
want = 500            # 日ごとの指定で「入れたい」にした人をその日に入れられないとき、1人1日ごとに減点
long_shift = 200      # 原則の長さを超えた30分ごとに減点（人数不足をうめるときだけ延ばす）
over = 10             # 必要人数より1人多い30分ごとに減点
balance = 20          # 一番多く働く人の勤務時間（30分ごと）に減点。勤務時間を人によって偏らせない
target_hours = 5      # 希望勤務時間との差（30分ごと）に減点
work_day = 2          # 出勤1日ごとに減点（短い勤務をばらばらに入れない）
