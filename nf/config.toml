# NF2026 シフト作成の設定
# 未確定の項目は仮の値です。実際の営業時間・必要人数に合わせて書き換えてください（画面の左側でも変えられます）。

# シフトを組む刻み（分）
slot_minutes = 30

[period]
# シフトを組む日。フォームで何も選ばなかった人は、この日すべて参加できるとみなす
dates = ["2026-11-20", "2026-11-21", "2026-11-22", "2026-11-23"]
# 「土日祝」「日祝」の当てはめで祝日として扱う日（11/23 は勤労感謝の日）
holidays = ["2026-11-23"]

[form]
# 「10:00」のように時刻が1つだけの選択肢を、そこから何分の時間帯とみなすか
single_time_minutes = 60

[shift]
# 1回の勤務の長さ（時間）。1日に入るのは1回（連続）まで
min_hours = 1
# 原則この長さまで。人数が足りない時間帯をうめるときだけ、max_hours まで延ばしてよい
normal_max_hours = 2
max_hours = 4

# 必要人数（会計係も1人と数える）。上から順に当てはめ、同じ時間帯は後の行で上書きする
# days: 毎日 / 平日 / 土 / 日祝 / 土日祝 / 曜日（例 "金"）/ 日付（例 "11/23"）
[[rules]]
days = "毎日"
start = "10:00"
end = "18:00"
people = 3

[accountant]
# 営業中はいつも、会計係（フォームの「あなたは会計ですか？」で「はい」）をこの人数以上入れる
min_people = 1

[solver]
# 計算時間の上限（秒）
time_limit_seconds = 20

# 優先条件の重み（大きいほど重視）。会計係を入れることは、これらすべてより先に守る
[weights]
shortage = 1000       # 必要人数に1人足りない30分ごとに減点
long_shift = 200      # 原則の長さを超えた30分ごとに減点（人数不足をうめるときだけ延ばす）
over = 10             # 必要人数より1人多い30分ごとに減点
balance = 20          # 一番多く働く人の勤務時間（30分ごと）に減点。勤務時間を人によって偏らせない
target_hours = 5      # 希望勤務時間との差（30分ごと）に減点
work_day = 2          # 出勤1日ごとに減点（短い勤務をばらばらに入れない）
